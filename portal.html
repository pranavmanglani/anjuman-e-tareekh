<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/x-icon" href="favicon.jpg">
    <title>ANJUMAN ए TAREEKH — Worker Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #222;
        }

        header {
            background: #173b2c;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #173b2c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #24553f;
        }

        .logout {
            background: #8b2f2f;
        }

        .logout:hover {
            background: #a33b3b;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dff3e5;
            color: #176b36;
        }

        .error {
            background: #f8dddd;
            color: #8b1e1e;
        }

        #portalSection {
            display: none;
        }

        .user-info {
            margin-bottom: 20px;
            color: #555;
        }
    
        /* ================================
           MY BLOGS / EDITOR UI
           ================================ */

        .blogs-heading {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            margin-bottom:20px;
        }

        .blogs-heading h2 {
            margin-bottom:5px;
        }

        .blogs-heading p {
            margin:0;
            color:#777;
        }

        .small-btn {
            width:auto;
            margin:0;
            padding:10px 16px;
            font-size:14px;
        }

        .blogs-status {
            padding:25px;
            text-align:center;
            color:#777;
            background:#faf8f2;
            border-radius:12px;
            margin-top:10px;
        }

        .blog-item {
            background:#fffdf8;
            border:1px solid #e4ddcf;
            border-radius:16px;
            padding:20px;
            margin-top:14px;
            transition:transform .2s ease, box-shadow .2s ease;
        }

        .blog-item:hover {
            transform:translateY(-3px);
            box-shadow:0 12px 30px rgba(23,59,44,.10);
        }

        .blog-item h3 {
            margin:0 0 8px;
            color:#173b2c;
            font-family:Georgia,serif;
            font-size:21px;
        }

        .blog-date {
            color:#9a8d78;
            font-size:12px;
            margin-bottom:12px;
        }

        .blog-preview {
            color:#555;
            line-height:1.6;
            white-space:pre-wrap;
            max-height:115px;
            overflow:hidden;
        }

        .blog-actions {
            display:flex;
            gap:9px;
            margin-top:16px;
        }

        .blog-actions button {
            width:auto;
            margin:0;
            padding:10px 15px;
            font-size:14px;
        }

        .edit-btn {
            background:#173b2c;
        }

        .delete-btn {
            background:#8b2f2f;
        }

        .modal {
            position:fixed;
            inset:0;
            z-index:1000;
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            background:rgba(10,28,20,.72);
            backdrop-filter:blur(7px);
        }

        .modal.show {
            display:flex;
            animation:modalFade .2s ease;
        }

        @keyframes modalFade {
            from { opacity:0; }
            to { opacity:1; }
        }

        .modal-box {
            width:100%;
            max-width:720px;
            max-height:90vh;
            overflow:auto;
            background:#fdfbf6;
            border-radius:22px;
            padding:28px;
            box-shadow:0 25px 80px rgba(0,0,0,.28);
            animation:modalUp .25s ease;
        }

        @keyframes modalUp {
            from {
                opacity:0;
                transform:translateY(20px) scale(.98);
            }
            to {
                opacity:1;
                transform:none;
            }
        }

        .modal-header {
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:15px;
            margin-bottom:10px;
        }

        .modal-header h2 {
            margin:5px 0 0;
        }

        .modal-kicker {
            color:#b28a48;
            font-size:11px;
            font-weight:bold;
            letter-spacing:2px;
        }

        .close-modal {
            width:42px;
            height:42px;
            padding:0;
            margin:0;
            border-radius:50%;
            background:#e9e2d5;
            color:#173b2c;
            font-size:25px;
        }

        .modal-actions {
            display:flex;
            gap:10px;
        }

        .modal-actions button {
            flex:1;
        }

        .cancel-btn {
            background:#777;
        }

        @media (max-width:600px) {
            .blogs-heading {
                align-items:flex-start;
                flex-direction:column;
            }

            .small-btn {
                width:100%;
            }

            .blog-actions {
                flex-direction:column;
            }

            .blog-actions button {
                width:100%;
            }

            .modal-box {
                padding:20px;
            }

            .modal-actions {
                flex-direction:column;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>ANJUMAN ए TAREEKH</h1>
    <p>TAREEKH AUR ANJUMAN — RESEARCH MEETS ZAIKA</p>
</header>


<div class="container">

    <!-- LOGIN -->
    <section id="loginSection" class="card">

        <h2>Worker Portal</h2>

        <p>
            Authorized workers only.
        </p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
                autocomplete="username"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage" class="message"></div>

    </section>


    <!-- PORTAL -->
    <section id="portalSection">

        <div class="card">

            <h2>Worker Dashboard</h2>

            <div class="user-info">
                Logged in as:
                <strong id="workerName"></strong>
            </div>

            <button
                type="button"
                class="logout"
                id="logoutButton"
            >
                Logout
            </button>

        </div>


        <!-- CREATE BLOG -->
        <div class="card">

            <h2>Create New Blog</h2>

            <form id="blogForm">

                <label for="blogName">
                    Blog Name
                </label>

                <input
                    type="text"
                    id="blogName"
                    placeholder="Enter blog title"
                    required
                >


                <label for="author">
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Author name"
                >


                <label for="blogContent">
                    Content
                </label>

                <textarea
                    id="blogContent"
                    placeholder="Write your blog here..."
                    required
                ></textarea>


                <button type="submit">
                    Publish Blog
                </button>

            </form>

            <div id="blogMessage" class="message"></div>

        </div>

        <!-- MY BLOGS -->
        <div class="card" id="myBlogsCard">

            <div class="blogs-heading">
                <div>
                    <h2>My Research Stories</h2>
                    <p>Blogs created by your username.</p>
                </div>

                <button type="button" id="refreshBlogsButton" class="small-btn">
                    Refresh
                </button>
            </div>

            <div id="blogsLoading" class="blogs-status">
                Loading your blogs...
            </div>

            <div id="blogsEmpty" class="blogs-status" style="display:none;">
                You haven't published any blogs yet.
            </div>

            <div id="myBlogsList"></div>

        </div>

        <!-- EDIT BLOG MODAL -->
        <div id="editModal" class="modal">
            <div class="modal-box">

                <div class="modal-header">
                    <div>
                        <span class="modal-kicker">RESEARCH JOURNAL</span>
                        <h2>Edit Blog</h2>
                    </div>

                    <button type="button" id="closeEditModal" class="close-modal">
                        ×
                    </button>
                </div>

                <form id="editBlogForm">

                    <input type="hidden" id="editBlogId">

                    <label for="editBlogName">Blog Name</label>
                    <input
                        type="text"
                        id="editBlogName"
                        required
                    >

                    <label for="editBlogContent">Content</label>
                    <textarea
                        id="editBlogContent"
                        required
                    ></textarea>

                    <div class="modal-actions">
                        <button type="submit" id="saveEditButton">
                            Save Changes
                        </button>

                        <button
                            type="button"
                            id="cancelEditButton"
                            class="cancel-btn"
                        >
                            Cancel
                        </button>
                    </div>

                    <div id="editMessage" class="message"></div>

                </form>

            </div>
        </div>

    </section>

</div>


<script>

    /*
    SUPABASE EDGE FUNCTION URLs
    */

    const LOGIN_URL =
        "https://xitmexidjgacikjpheji.supabase.co/functions/v1/portal-login";

    const CREATE_BLOG_URL =
        "https://xitmexidjgacikjpheji.supabase.co/functions/v1/create-blog";

    const MANAGE_BLOGS_URL =
        "https://xitmexidjgacikjpheji.supabase.co/functions/v1/manage-blogs";




    let workerUsername = "";
    let workerPassword = "";
    let workerNameValue = "";


    
    function showMessage(element, message, success) {

        element.textContent = message;

        element.className =
            "message " + (success ? "success" : "error");

        element.style.display = "block";
    }


    /*
    ==========================================
    LOGIN
    ==========================================
    */

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("loginMessage");


            message.style.display = "none";


            try {

                const response = await fetch(LOGIN_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });


                const result = await response.json();


                if (!response.ok || !result.success) {

                    showMessage(
                        message,
                        result.error || "Login failed",
                        false
                    );

                    return;
                }


                /*
                Store credentials ONLY in memory.
                */

                workerUsername = username;
                workerPassword = password;

                workerNameValue =
                    result.user.name || username;


                /*
                Hide login
                */

                document
                    .getElementById("loginSection")
                    .style.display = "none";


                /*
                Show portal
                */

                document
                    .getElementById("portalSection")
                    .style.display = "block";


                document
                    .getElementById("workerName")
                    .textContent = workerNameValue;


                /*
                Clear password input.
                */

                document
                    .getElementById("password")
                    .value = "";

                // Load only this worker's blogs.
                await loadMyBlogs();

            } catch (error) {

                console.error(error);

                showMessage(
                    message,
                    "Could not connect to server.",
                    false
                );
            }

        });


    /*
    ==========================================
    CREATE BLOG
    ==========================================
    */

    document
        .getElementById("blogForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            if (!workerUsername || !workerPassword) {

                alert("Please login again.");

                return;
            }


            const blogName =
                document.getElementById("blogName").value.trim();

            const content =
                document.getElementById("blogContent").value.trim();

            const message =
                document.getElementById("blogMessage");


            message.style.display = "none";


            try {

                const response = await fetch(
                    CREATE_BLOG_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            username: workerUsername,

                            password: workerPassword,

                            blog_name: blogName,

                            content: content,
                            published: true

                        })

                    }
                );


                const result =
                    await response.json();


                if (!response.ok || !result.success) {

                    showMessage(
                        message,
                        result.error || "Could not publish blog.",
                        false
                    );

                    return;
                }


                showMessage(
                    message,
                    "Blog published successfully!",
                    true
                );


                /*
                Clear form
                */

                document
                    .getElementById("blogForm")
                    .reset();


            } catch (error) {

                console.error(error);

                showMessage(
                    message,
                    "Could not connect to server.",
                    false
                );
            }

        });



    /*
    ==========================================
    LOAD MY BLOGS
    ==========================================
    */

    async function loadMyBlogs() {

        const list = document.getElementById("myBlogsList");
        const loading = document.getElementById("blogsLoading");
        const empty = document.getElementById("blogsEmpty");

        list.innerHTML = "";
        loading.style.display = "block";
        empty.style.display = "none";

        try {

            const response = await fetch(MANAGE_BLOGS_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: workerUsername,
                    password: workerPassword,
                    action: "list"
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.error || "Could not load blogs.");
            }

            const blogs = result.blogs || [];

            loading.style.display = "none";

            if (!blogs.length) {
                empty.style.display = "block";
                return;
            }

            blogs.forEach(function(blog) {

                const item = document.createElement("div");
                item.className = "blog-item";

                const date = blog.created_at
                    ? new Date(blog.created_at).toLocaleDateString(
                        "en-IN",
                        {
                            day: "numeric",
                            month: "short",
                            year: "numeric"
                        }
                    )
                    : "";

                item.innerHTML = `
                    <h3></h3>
                    <div class="blog-date"></div>
                    <div class="blog-preview"></div>

                    <div class="blog-actions">
                        <button type="button" class="edit-btn">
                            Edit
                        </button>

                        <button type="button" class="delete-btn">
                            Delete
                        </button>
                    </div>
                `;

                item.querySelector("h3").textContent =
                    blog.blog_name || "Untitled";

                item.querySelector(".blog-date").textContent =
                    date;

                item.querySelector(".blog-preview").textContent =
                    blog.content || "";

                item.querySelector(".edit-btn")
                    .addEventListener("click", function() {
                        openEditBlog(blog);
                    });

                item.querySelector(".delete-btn")
                    .addEventListener("click", function() {
                        deleteBlog(blog.id, blog.blog_name);
                    });

                list.appendChild(item);
            });

        } catch (error) {

            console.error(error);

            loading.style.display = "none";

            empty.style.display = "block";
            empty.textContent =
                error.message || "Could not load your blogs.";
        }
    }


    /*
    ==========================================
    OPEN EDIT BLOG
    ==========================================
    */

    function openEditBlog(blog) {

        document.getElementById("editBlogId").value =
            blog.id;

        document.getElementById("editBlogName").value =
            blog.blog_name || "";

        document.getElementById("editBlogContent").value =
            blog.content || "";

        document.getElementById("editMessage").style.display =
            "none";

        document.getElementById("editModal")
            .classList.add("show");

        document.body.style.overflow = "hidden";
    }


    /*
    ==========================================
    CLOSE EDIT MODAL
    ==========================================
    */

    function closeEditBlog() {

        document.getElementById("editModal")
            .classList.remove("show");

        document.body.style.overflow = "";
    }


    document.getElementById("closeEditModal")
        .addEventListener("click", closeEditBlog);

    document.getElementById("cancelEditButton")
        .addEventListener("click", closeEditBlog);


    document.getElementById("editModal")
        .addEventListener("click", function(event) {

            if (event.target === this) {
                closeEditBlog();
            }

        });


    /*
    ==========================================
    UPDATE BLOG
    ==========================================
    */

    document.getElementById("editBlogForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            if (!workerUsername || !workerPassword) {
                alert("Please login again.");
                return;
            }

            const blogId =
                document.getElementById("editBlogId").value;

            const blogName =
                document.getElementById("editBlogName").value.trim();

            const content =
                document.getElementById("editBlogContent").value.trim();

            const message =
                document.getElementById("editMessage");

            const button =
                document.getElementById("saveEditButton");

            message.style.display = "none";

            button.disabled = true;
            button.textContent = "Saving...";

            try {

                const response = await fetch(MANAGE_BLOGS_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: workerUsername,
                        password: workerPassword,
                        action: "update",
                        blog_id: blogId,
                        blog_name: blogName,
                        content: content
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    showMessage(
                        message,
                        result.error || "Could not update blog.",
                        false
                    );
                    return;
                }

                showMessage(
                    message,
                    "Blog updated successfully.",
                    true
                );

                await loadMyBlogs();

                setTimeout(closeEditBlog, 600);

            } catch (error) {

                console.error(error);

                showMessage(
                    message,
                    "Could not connect to server.",
                    false
                );

            } finally {

                button.disabled = false;
                button.textContent = "Save Changes";
            }

        });


    /*
    ==========================================
    DELETE BLOG
    ==========================================
    */

    async function deleteBlog(blogId, blogName) {

        if (!workerUsername || !workerPassword) {
            alert("Please login again.");
            return;
        }

        const confirmed = confirm(
            'Delete "' +
            (blogName || "this blog") +
            '"?\n\nThis cannot be undone.'
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(MANAGE_BLOGS_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: workerUsername,
                    password: workerPassword,
                    action: "delete",
                    blog_id: blogId
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                alert(result.error || "Could not delete blog.");
                return;
            }

            await loadMyBlogs();

        } catch (error) {

            console.error(error);

            alert("Could not connect to server.");
        }
    }


    /*
    ==========================================
    REFRESH BLOGS
    ==========================================
    */

    document.getElementById("refreshBlogsButton")
        .addEventListener("click", loadMyBlogs);


    /*
    ==========================================
    LOGOUT
    ==========================================
    */

    document
        .getElementById("logoutButton")
        .addEventListener("click", function() {

            /*
            Destroy credentials from memory.
            */

            workerUsername = "";
            workerPassword = "";
            workerNameValue = "";

            document.getElementById("myBlogsList").innerHTML = "";
            document.getElementById("blogsLoading").style.display = "none";
            document.getElementById("blogsEmpty").style.display = "none";
            closeEditBlog();


            /*
            Hide portal
            */

            document
                .getElementById("portalSection")
                .style.display = "none";


            /*
            Show login
            */

            document
                .getElementById("loginSection")
                .style.display = "block";


            /*
            Clear login form
            */

            document
                .getElementById("loginForm")
                .reset();

        });

</script>

</body>
</html>
