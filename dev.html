<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0f1715;
      --card-bg: #182421;
      --accent-gold: #c5a059;
      --accent-gold-hover: #e0b86c;
      --accent-green: #1b4332;
      --text-light: #f4f1ea;
      --text-muted: #a3b18a;
      --border-color: #2c3e35;
      --danger: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
    }

    .logo-title {
      color: var(--accent-gold);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
    }

    .auth-wrapper {
      max-width: 400px;
      margin: 4rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .auth-wrapper h2 {
      color: var(--accent-gold);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="password"],
    input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent-gold);
      color: var(--bg-dark);
      border: none;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-gold-hover);
    }

    .btn-logout {
      width: auto;
      padding: 0.4rem 1rem;
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
    }

    .btn-logout:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
    }

    @media (max-width: 850px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .panel h2 {
      color: var(--accent-gold);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .asset-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
    }

    .asset-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .asset-name {
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .asset-actions {
      margin-top: auto;
      padding-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }

    .btn-sm {
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 3px;
    }

    .btn-copy {
      background: var(--accent-green);
      color: var(--text-light);
    }

    .btn-delete {
      background: var(--danger);
      color: white;
    }

    .status-msg {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--accent-gold);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-title">DEVELOPER PORTAL</div>
    <div id="userInfo" class="hidden">
      <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <div class="container">

    <div id="loginView" class="auth-wrapper">
      <h2>Developer Authentication</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Developer Username</label>
          <input type="text" id="username" required placeholder="developer">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Authenticate</button>
        <div id="authStatus" class="status-msg"></div>
      </form>
    </div>

    <div id="dashboardView" class="dashboard hidden">

      <div class="panel">
        <h2>Upload Asset</h2>
        <form id="uploadForm" onsubmit="handleUpload(event)">
          <div class="form-group">
            <label for="customName">Custom Image Key (e.g. hero-banner-1)</label>
            <input type="text" id="customName" required placeholder="journey-hero-bg">
          </div>
          <div class="form-group">
            <label for="imageFile">Select Image</label>
            <input type="file" id="imageFile" accept="image/*" required>
          </div>
          <button type="submit" class="btn" id="uploadBtn">Upload to Cloud</button>
          <div id="uploadStatus" class="status-msg"></div>
        </form>
      </div>


      <div class="panel">
        <h2>Asset Library</h2>
        <div id="assetGrid" class="asset-grid">

        </div>
      </div>
    </div>
  </div>

  <script>

    const SUPABASE_URL = "https://your-supabase-project.supabase.co";
    const SUPABASE_KEY = "your-anon-key";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('authStatus');

      status.textContent = "Authenticating...";
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        status.textContent = "Error: " + error.message;
      } else {
        status.textContent = "";
        showDashboard();
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      showLogin();
    }

    function showDashboard() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('userInfo').classList.remove('hidden');
      loadAssets();
    }

    function showLogin() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('userInfo').classList.add('hidden');
    }

    async function handleUpload(e) {
      e.preventDefault();
      const customNameInput = document.getElementById('customName');
      const fileInput = document.getElementById('imageFile');
      const status = document.getElementById('uploadStatus');
      const btn = document.getElementById('uploadBtn');

      const customName = customNameInput.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-');
      const file = fileInput.files[0];

      if (!file || !customName) return;

      btn.disabled = true;
      status.textContent = "Uploading image...";

      try {
        const fileExt = file.name.split('.').pop();
        const filePath = `custom-assets/${customName}.${fileExt}`;

        const { data: storageData, error: storageError } = await supabase.storage
          .from('site-assets')
          .upload(filePath, file, { upsert: true });

        if (storageError) throw storageError;

        const { data: publicUrlData } = supabase.storage
          .from('site-assets')
          .getPublicUrl(filePath);

        const publicUrl = publicUrlData.publicUrl;

        const { error: dbError } = await supabase
          .from('developer_assets')
          .upsert({ asset_key: customName, public_url: publicUrl, file_path: filePath });

        if (dbError) throw dbError;

        status.textContent = "Upload successful!";
        customNameInput.value = '';
        fileInput.value = '';
        loadAssets();
      } catch (err) {
        status.textContent = "Upload failed: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function loadAssets() {
      const grid = document.getElementById('assetGrid');
      grid.innerHTML = "Loading...";

      const { data, error } = await supabase
        .from('developer_assets')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = "Error loading assets.";
        return;
      }

      if (data.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; color: var(--text-muted);'>No assets uploaded yet.</p>";
        return;
      }

      grid.innerHTML = '';
      data.forEach(asset => {
        const card = document.createElement('div');
        card.className = 'asset-card';
        card.innerHTML = `
          <img src="${asset.public_url}" alt="${asset.asset_key}">
          <div class="asset-name">${asset.asset_key}</div>
          <div class="asset-actions">
            <button class="btn btn-sm btn-copy" onclick="copyToClipboard('${asset.public_url}')">Copy URL</button>
            <button class="btn btn-sm btn-delete" onclick="deleteAsset('${asset.id}', '${asset.file_path}')">Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function deleteAsset(id, filePath) {
      if (!confirm("Are you sure you want to delete this asset?")) return;

      await supabase.storage.from('site-assets').remove([filePath]);
      await supabase.from('developer_assets').delete().eq('id', id);
      loadAssets();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert("Public URL copied to clipboard!");
    }

    checkSession();
  </script>
</body>
</html>
